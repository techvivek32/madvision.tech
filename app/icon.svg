    <rect x="4" y="4" width="16" height="16"/><rect x="76" y="4" width="16" height="16"/>
    <rect x="4" y="22" width="16" height="16"/><rect x="76" y="22" width="16" height="16"/>
    <rect x="4" y="40" width="16" height="16"/><rect x="76" y="40" width="16" height="16"/>
    <rect x="4" y="58" width="16" height="16"/><rect x="76" y="58" width="16" height="16"/>
    <rect x="4" y="76" width="16" height="16"/><rect x="76" y="76" width="16" height="16"/>
  </g>
  <g fill="#c8ff00">
    <rect x="22" y="22" width="16" height="16"/>
    <rect x="58" y="22" width="16" height="16"/>
    <rect x="40" y="40" width="16" height="16"/>
  </g>
</svg>
